<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>思维星球 · 系统化知识地图</title>
<link rel="stylesheet" href="assets/styles.css">
<style>
  .spine-mod{margin-bottom:18px;}
  .board{border-left:4px solid var(--c,#4C6FFF);padding:8px 0 8px 12px;margin-top:10px;}
  .board-name{font:800 15px var(--f-head);color:var(--text);margin-bottom:6px;}
  .tier-row{display:flex;gap:8px;align-items:flex-start;margin:5px 0;flex-wrap:wrap;}
  .tier-lab{flex:0 0 46px;font:800 12px var(--f-body);color:var(--brand);padding-top:4px;}
  .tier-tags{display:flex;gap:6px;flex-wrap:wrap;}
  .xueersi{font-size:12px;color:var(--text-soft);background:var(--surface-2);display:inline-block;padding:2px 10px;border-radius:999px;margin-top:4px;}
  .band-card{border-top:4px solid var(--c);}
  .band-desc{font-size:13px;color:var(--text-soft);margin-top:6px;line-height:1.5;}
  .axis{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--surface-2);}
  .axis-ico{width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px;flex:0 0 38px;}
  /* 知识树叶子节点 × 学而思课程 */
  .topic-node{display:flex;flex-direction:column;gap:3px;background:var(--surface-2);border:none;border-radius:12px;padding:8px 10px;width:calc(33.333% - 8px);min-width:190px;box-sizing:border-box;}
  .tname{font:800 13px var(--f-head);color:var(--text);line-height:1.3;display:inline-block;text-decoration:none;cursor:pointer;}
  .tname:hover{color:var(--brand);text-decoration:underline;}
  .tname::after{content:" ↗";font-size:11px;color:var(--brand);font-weight:700;}
  .clink{font-size:11.5px;color:var(--brand);text-decoration:none;font-weight:700;line-height:1.35;}
  .clink:hover{text-decoration:underline;}
  .csum{font-size:11px;color:var(--text-soft);line-height:1.5;margin:0;}
  /* 学而思官方对标课程（由 scraper 抓取） */
  .xcourse{font-size:11px;color:#B5762A;text-decoration:none;font-weight:700;line-height:1.35;display:inline-flex;align-items:center;gap:4px;margin-top:1px;}
  .xcourse:hover{text-decoration:underline;}
  .xbadge{font-size:9.5px;padding:1px 6px;border-radius:999px;font-weight:700;white-space:nowrap;}
  .xbadge-standard{background:#E8F0FF;color:#2E5BFF;}
  .xbadge-advanced{background:#FFE9D6;color:#C2541B;}
  /* 知识树内嵌课程讲义（自包含，不依赖外链） */
  .kcourse{border-top:1px dashed var(--line,#e3e7f0);margin-top:5px;padding-top:5px;}
  .kcourse>summary{cursor:pointer;font:700 11.5px var(--f-body);color:var(--brand);list-style:none;user-select:none;}
  .kcourse>summary::-webkit-details-marker{display:none;}
  .kcourse>summary::before{content:"▸";margin-right:4px;}
  .kcourse[open]>summary::before{content:"▾";}
  .kbody{margin-top:6px;display:flex;flex-direction:column;gap:5px;}
  .kttl{font:800 12.5px var(--f-head);color:var(--text);}
  .krow{font-size:11px;color:var(--text-soft);line-height:1.55;margin:0;}
  .krow>b{color:var(--brand);font-weight:700;margin-right:3px;}
  .kchip{display:inline-block;background:var(--brand-soft,#EAF0FF);color:var(--brand);border-radius:6px;padding:1px 7px;font-size:10.5px;margin:1px 2px 1px 0;}
  .kex{display:block;color:var(--text);margin-top:1px;}
  .kexa{display:block;color:#1E7A46;font-weight:600;margin-top:1px;}
  .kpit{background:#FFF4E8;border-radius:6px;padding:3px 6px;color:#9A4B12;}
  .ksrc{font-size:10.5px;color:var(--text-soft);text-decoration:none;margin-top:2px;}
  .ksrc:hover{text-decoration:underline;}
  @media(max-width:560px){ .topic-node{width:100%;} }
</style>
</head>
<body>

<header class="app-header">
  <div class="container">
    <a class="row" href="curriculum.html" style="gap:8px;color:var(--text-soft);font:700 14px var(--f-body);">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      <span>返回课程体系</span>
    </a>
    <div class="avatar">朵</div>
  </div>
</header>

<main class="container">

  <section class="section">
    <div class="t-h1">🗺️ 系统化知识地图</div>
    <p class="t-sm" style="margin-top:6px;" id="metaNote"></p>
  </section>

  <!-- 小思引导 -->
  <section class="section row" style="align-items:flex-end;gap:12px;">
    <svg class="mascot" viewBox="0 0 100 110" style="width:60px;height:60px;">
      <line x1="50" y1="20" x2="50" y2="8" stroke="#4C6FFF" stroke-width="3"/><circle cx="50" cy="6" r="4" fill="#FF8A4C"/>
      <circle cx="50" cy="48" r="30" fill="#fff" stroke="#4C6FFF" stroke-width="4"/>
      <circle cx="50" cy="48" r="21" fill="#C9D6FF"/>
      <circle cx="44" cy="44" r="5" fill="#fff"/><circle cx="56" cy="44" r="5" fill="#fff"/>
      <circle cx="44" cy="44" r="2.4" fill="#232745"/><circle cx="56" cy="44" r="2.4" fill="#232745"/>
      <path d="M42 58 Q50 64 58 58" stroke="#232745" stroke-width="3" fill="none" stroke-linecap="round"/>
    </svg>
    <div class="bubble" style="margin-bottom:2px;font-size:14px;">这是我们的<b>思维宇宙全图</b>🚀<br>四颗星球 × 知识板块 × 三阶进阶，再加四个分层营，<br>层层递进不跳级！</div>
  </section>

  <!-- 模块知识树 -->
  <section class="section">
    <div class="t-h3" style="margin-bottom:6px;">① 四大思维星球 · 知识树</div>
    <p class="t-sm" style="margin-bottom:8px;">每个模块拆成若干「知识板块」，板块下按 L1→L2→L3 螺旋上升，专题对标学而思体系。</p>
    <div id="spineList"></div>
  </section>

  <!-- 分层营 -->
  <section class="section">
    <div class="t-h3" style="margin-bottom:6px;">② 进阶分层营（难度维度）</div>
    <p class="t-sm" style="margin-bottom:12px;">分层营与「年龄阶 L1–L3」正交：任何一阶内都能按孩子水平选层练习。</p>
    <div class="row wrap" id="bandList" style="gap:12px;"></div>
  </section>

  <!-- 能力轴 -->
  <section class="section">
    <div class="t-h3" style="margin-bottom:6px;">③ 六维思维能力轴</div>
    <p class="t-sm" style="margin-bottom:12px;">看板雷达图即由这六维绘制，记录孩子的思维成长轮廓。</p>
    <div class="card" id="axisList" style="padding:8px 16px;"></div>
  </section>

  <section class="section">
    <a href="curriculum.html" class="btn btn-primary btn-block">📚 去按知识树选择课程闯关</a>
  </section>

</main>

<nav class="tabbar">
  <a class="tab" href="planet.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8M5 10v10h14V10"/></svg>星球</a>
  <a class="tab active" href="curriculum.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16v14H4zM4 9h16M9 5v14"/></svg>课程</a>
  <a class="tab" href="exercise.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="8" width="18" height="10" rx="5"/><path d="M8 12h.01M12 12h.01M16 12h.01M7 8V6h10v2"/></svg>闯关</a>
  <a class="tab" href="dashboard.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>看板</a>
  <a class="tab" href="parent.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-4.5-9-9a4.5 4.5 0 0 1 9-2 4.5 4.5 0 0 1 9 2c-2 4.5-9 9-9 9Z"/></svg>家长</a>
</nav>

<script src="assets/framework.js"></script>
<script src="assets/framework-courses.js"></script>
<script src="assets/knowledge-courses.js"></script>
<script src="assets/xueersi-matched-courses.js"></script>
<script src="assets/curriculum.js"></script>
<script src="assets/questions.js"></script>
<script src="assets/play.js"></script>
<script>
document.getElementById('metaNote').textContent = `${FRAMEWORK_META.version} ｜ 参考：${FRAMEWORK_META.source}`;

/* 模块知识树 */
const CLAZ = { number:"m-number", logic:"m-logic", shape:"m-shape", space:"m-space" };
const CCOL = { number:"var(--m-number)", logic:"var(--m-logic)", shape:"var(--m-shape)", space:"var(--m-space)" };
const spineList = document.getElementById('spineList');
["number","logic","shape","space"].forEach(m=>{
  const sp = MODULE_SPINE[m];
  const card = document.createElement('div');
  card.className = `card spine-mod ${CLAZ[m]}`;
  card.style.setProperty('--c', CCOL[m]);
  let boardsHtml = sp.boards.map(b=>{
    const boardCourse = (typeof FRAMEWORK_COURSES!=='undefined' && FRAMEWORK_COURSES[m+":"+b.id]) ? FRAMEWORK_COURSES[m+":"+b.id] : null;
    const boardCourseHtml = boardCourse ? `<span class="xueersi">📚 学而思课程支撑：${boardCourse.title}</span>` : '';
    const tiers = ["L1","L2","L3"].map(l=>{
      const topics = (b.tiers[l]||[]).map(function(t){
        const kc = (typeof getKnowledgeCourse==='function') ? getKnowledgeCourse(m, b.id, l, t) : null;
        let kcard = '';
        if(kc){
          const chips = (kc.keypoints||[]).map(function(k){ return `<span class="kchip">${k}</span>`; }).join('');
          kcard = `<details class="kcourse"><summary>📖 学而思课程讲义</summary><div class="kbody">`
            + `<div class="kttl">${kc.title}</div>`
            + `<div class="krow"><b>学习目标</b>${kc.objective}</div>`
            + `<div class="krow"><b>学而思讲法</b>${kc.method}</div>`
            + `<div class="krow"><b>关键知识点</b>${chips}</div>`
            + `<div class="krow"><b>典型例题</b><span class="kex">问：${kc.example.q}</span><span class="kexa">答：${kc.example.a}</span></div>`
            + `<div class="krow kpit"><b>易错点</b>${kc.pitfall}</div>`
            + `<div class="krow"><b>三阶进阶</b>${kc.progression}</div>`
            + `<span class="ksrc">学而思来源 · ${kc.xueersi}</span>`
            + `</div></details>`;
        }
        const tlink = `knowledge-detail.html?m=${m}&b=${b.id}&l=${l}&t=${encodeURIComponent(t)}`;
        const learnedChip = (typeof TP!=='undefined' && TP.isLearned(m, b.id, l, t)) ? '<span class="learned-chip">已学会</span>' : '';
        return `<div class="topic-node"><a class="tname" href="${tlink}" title="点击进入「${t}」知识详解">${t}</a>${learnedChip}${kcard}</div>`;
      }).join('');
      return `<div class="tier-row"><span class="tier-lab">${l}</span><div class="tier-tags">${topics}</div></div>`;
    }).join('');
    return `<div class="board"><div class="board-name">▸ ${b.name}</div>${boardCourseHtml}${tiers}</div>`;
  }).join('');
  card.innerHTML = `
    <div class="row between" style="align-items:center;">
      <div class="t-h2" style="font-size:19px;">${sp.icon} ${sp.name}</div>
      <span class="badge ${CLAZ[m]==='m-number'?'badge-number':CLAZ[m]==='m-logic'?'badge-logic':CLAZ[m]==='m-shape'?'badge-shape':'badge-space'}">${getChapters(m,'L1').length*3} 章</span>
    </div>
    <span class="xueersi">学而思对应：${sp.xueersi}</span>
    ${boardsHtml}`;
  spineList.appendChild(card);
});

/* 分层营 */
const bandList = document.getElementById('bandList');
FRAMEWORK_BANDS.forEach(b=>{
  const el = document.createElement('div');
  el.className = 'card band-card';
  el.style.flex = '1 1 150px';
  el.style.minWidth = '150px';
  el.style.setProperty('--c', b.color);
  el.innerHTML = `
    <div class="row between"><span class="t-h3" style="font-size:16px;">${b.name}</span><span class="chip" style="height:24px;font-size:11px;background:${b.color}22;color:${b.color};border:none;">${b.tag}</span></div>
    <div class="band-desc">${b.desc}</div>`;
  bandList.appendChild(el);
});

/* 能力轴 */
const AX_ICO = { observe:"👀", reason:"🧠", compute:"🔢", spatial:"🧊", abstract:"💡", strategy:"🎯" };
const axisList = document.getElementById('axisList');
ABILITY.forEach(a=>{
  const el = document.createElement('div');
  el.className = 'axis';
  el.innerHTML = `<div class="axis-ico" style="background:var(--brand-soft);">${AX_ICO[a.id]||'⭐'}</div><div><div class="t-h3" style="font-size:15px;">${a.name}</div><div class="t-sm">${a.desc}</div></div>`;
  axisList.appendChild(el);
});

/* 趣味性：星空背景 + 可点吉祥物 */
TP.twinkle();
TP.initMascot();
</script>
</body>
</html>
