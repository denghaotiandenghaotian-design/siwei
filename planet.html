<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>思维星球 · 星球首页</title>
<link rel="stylesheet" href="assets/styles.css">
</head>
<body>

<header class="app-header">
  <div class="container">
    <div class="logo">
      <svg class="planet" viewBox="0 0 40 40"><circle cx="20" cy="20" r="11" fill="#4C6FFF"/><ellipse cx="20" cy="20" rx="19" ry="7" fill="none" stroke="#FF8A4C" stroke-width="3" transform="rotate(-20 20 20)"/></svg>
      思维星球
    </div>
    <button class="btn-sound" id="soundBtn" title="开关音效" onclick="tpToggleSound()">🔊</button>
    <div class="avatar">朵</div>
  </div>
</header>

<main class="container">

  <!-- Hero 吉祥物引导 -->
  <section class="section row" style="align-items:flex-end;gap:14px;">
    <svg class="mascot" viewBox="0 0 100 110">
      <line x1="50" y1="20" x2="50" y2="8" stroke="#4C6FFF" stroke-width="3"/>
      <circle cx="50" cy="6" r="4" fill="#FF8A4C"/>
      <circle cx="50" cy="48" r="30" fill="#fff" stroke="#4C6FFF" stroke-width="4"/>
      <circle cx="50" cy="48" r="21" fill="#C9D6FF"/>
      <circle cx="44" cy="44" r="5" fill="#fff"/><circle cx="56" cy="44" r="5" fill="#fff"/>
      <circle cx="44" cy="44" r="2.4" fill="#232745"/><circle cx="56" cy="44" r="2.4" fill="#232745"/>
      <path d="M42 58 Q50 64 58 58" stroke="#232745" stroke-width="3" fill="none" stroke-linecap="round"/>
      <circle cx="38" cy="56" r="4" fill="#FF9DB0" opacity=".7"/><circle cx="62" cy="56" r="4" fill="#FF9DB0" opacity=".7"/>
      <rect x="33" y="76" width="34" height="22" rx="11" fill="#4C6FFF"/>
      <rect x="40" y="82" width="20" height="9" rx="4" fill="#FFD27A"/>
    </svg>
    <div class="bubble" style="margin-bottom:8px;">嗨！我是小思 🚀<br>今天想去哪颗星球探险呀？</div>
  </section>

  <!-- 年龄分阶选择 -->
  <section class="section">
    <div class="t-h3" style="margin-bottom:12px;">先选选你的探险段位 👇</div>
    <div class="row wrap" id="stageRow">
      <button class="chip" data-stage="L1">6–8岁 · 启蒙</button>
      <button class="chip active" data-stage="L2">9–10岁 · 发展</button>
      <button class="chip" data-stage="L3">11–13岁 · 进阶</button>
    </div>
    <p class="t-sm" id="stageDesc" style="margin-top:10px;">发展段 · 9–10岁：开始逻辑推理与图形组合，题目更有挑战但依然好玩！</p>
  </section>

  <!-- 今日目标 -->
  <section class="section">
    <div class="card row between">
      <div>
        <div class="t-nano">今日星星目标</div>
        <div class="t-h2" style="margin-top:4px;">已收集 <span class="num" id="dayStars" style="color:var(--accent)">0</span> / <span id="dayGoal">5</span> ⭐</div>
        <div class="t-sm" style="margin-top:4px;" id="dayTip">今天还没收集星星，去学一个知识点吧！</div>
        <div class="t-sm" style="margin-top:4px;">🔥 连续打卡 <span class="num" id="streakN" style="color:var(--ok)">0</span> 天</div>
      </div>
      <div class="ring ring-lg" id="dayRing" style="--p:0;--c:var(--accent)"><span id="dayRingTxt">0%</span></div>
    </div>
  </section>

  <!-- 四模块入口 -->
  <section class="section">
    <div class="t-h3" style="margin-bottom:12px;">四颗思维星球 🪐</div>
    <div class="grid-2">
      <a href="curriculum.html" class="card card-module m-logic module-card">
        <div class="module-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6M10 22h4M12 2a7 7 0 0 0-4 12.7c.6.5 1 1.2 1 2V18h6v-1.3c0-.8.4-1.5 1-2A7 7 0 0 0 12 2Z"/></svg></div>
        <div class="t-h3">逻辑推理</div>
        <div class="row between" style="margin-top:8px;">
          <span class="t-sm">找规律 · 分类</span>
          <div class="ring" id="ringLogic" style="--p:72;--c:var(--m-logic);width:48px;height:48px;"><span style="font-size:12px">72</span></div>
        </div>
      </a>

      <a href="curriculum.html" class="card card-module m-shape module-card">
        <div class="module-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="8" r="4"/><rect x="13" y="12" width="8" height="8" rx="2"/><path d="M3 18 7 14 11 18"/></svg></div>
        <div class="t-h3">图形认知</div>
        <div class="row between" style="margin-top:8px;">
          <span class="t-sm">形状 · 对称</span>
          <div class="ring" id="ringShape" style="--p:55;--c:var(--m-shape);width:48px;height:48px;"><span style="font-size:12px">55</span></div>
        </div>
      </a>

      <a href="curriculum.html" class="card card-module m-number module-card">
        <div class="module-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="3"/><path d="M8 7h8M8 11h2M12 11h4M8 15h2M12 15h4M8 19h2M12 19h4"/></svg></div>
        <div class="t-h3">数感运算</div>
        <div class="row between" style="margin-top:8px;">
          <span class="t-sm">加减 · 巧算</span>
          <div class="ring" id="ringNumber" style="--p:40;--c:var(--m-number);width:48px;height:48px;"><span style="font-size:12px">40</span></div>
        </div>
      </a>

      <a href="curriculum.html" class="card card-module m-space module-card">
        <div class="module-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2 3 7v10l9 5 9-5V7Z"/><path d="M3 7l9 5 9-5M12 12v10"/></svg></div>
        <div class="t-h3">空间想象</div>
        <div class="row between" style="margin-top:8px;">
          <span class="t-sm">方位 · 立体</span>
          <div class="ring" id="ringSpace" style="--p:30;--c:var(--m-space);width:48px;height:48px;"><span style="font-size:12px">30</span></div>
        </div>
      </a>
    </div>
  </section>

  <section class="section">
    <a href="exercise.html" class="btn btn-primary btn-block">▶ 继续闯关（逻辑推理 · 第 3 关）</a>
  </section>

  <section class="section">
    <a href="index.html" class="btn btn-accent btn-block">💡 支持与说明</a>
  </section>

</main>

<!-- 底部 Tab -->
<nav class="tabbar">
  <a class="tab active" href="planet.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8M5 10v10h14V10"/></svg>星球</a>
  <a class="tab" href="curriculum.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16v14H4zM4 9h16M9 5v14"/></svg>课程</a>
  <a class="tab" href="exercise.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="8" width="18" height="10" rx="5"/><path d="M8 12h.01M12 12h.01M16 12h.01M7 8V6h10v2"/></svg>闯关</a>
  <a class="tab" href="dashboard.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>看板</a>
  <a class="tab" href="parent.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-4.5-9-9a4.5 4.5 0 0 1 9-2 4.5 4.5 0 0 1 9 2c-2 4.5-9 9-9 9Z"/></svg>家长</a>
</nav>

<script src="assets/seats.js"></script>
<script src="assets/framework.js"></script>
<script src="assets/play.js"></script>
<script>
const descs={
 L1:"启蒙段 · 6–8岁：认识形状与数字，用游戏建立最基础的思维直觉。",
 L2:"发展段 · 9–10岁：开始逻辑推理与图形组合，题目更有挑战但依然好玩！",
 L3:"进阶段 · 11–13岁：复杂规律、多步运算与空间旋转，锻炼系统性思考。"
};
document.querySelectorAll('#stageRow .chip').forEach(c=>{
 c.addEventListener('click',()=>{
   document.querySelectorAll('#stageRow .chip').forEach(x=>x.classList.remove('active'));
   c.classList.add('active');
   document.getElementById('stageDesc').textContent=descs[c.dataset.stage];
 });
});

/* —— 趣味性：实时数据 + 氛围 —— */
(function(){
  const P=TP.get(), goal=TP.GOAL, ds=TP.todayStars();
  document.getElementById('dayGoal').textContent=goal;
  document.getElementById('dayStars').textContent=ds;
  document.getElementById('streakN').textContent=P.streak.count;
  const pct=Math.min(100,Math.round(ds/goal*100));
  const ring=document.getElementById('dayRing');
  ring.style.setProperty('--p',pct);
  document.getElementById('dayRingTxt').textContent=pct+'%';
  document.getElementById('dayTip').textContent = pct>=100
    ? '今日目标达成！你就是星球小英雄 🦸'
    : ('还差 '+(goal-ds)+' 颗星，就能点亮今日星球啦～');
  // 各模块已学会占比（有 framework.js 时实时计算）
  const mods={logic:0,shape:0,number:0,space:0}, tot={logic:0,shape:0,number:0,space:0};
  Object.values(P.learned).forEach(x=>{ if(x&&x.m&&mods[x.m]!==undefined) mods[x.m]++; });
  if(typeof MODULE_SPINE!=='undefined'&&MODULE_SPINE){
    Object.keys(tot).forEach(k=>{ MODULE_SPINE[k].boards.forEach(b=>{['L1','L2','L3'].forEach(l=>{tot[k]+=(b.tiers[l]||[]).length;});}); });
  }
  [['ringLogic','logic'],['ringShape','shape'],['ringNumber','number'],['ringSpace','space']].forEach(([id,mod])=>{
    const el=document.getElementById(id); if(!el) return;
    const p=tot[mod]?Math.round(mods[mod]/tot[mod]*100):0;
    el.style.setProperty('--p',p); el.querySelector('span').textContent=p;
  });
})();
TP.twinkle(); TP.initMascot();
function tpToggleSound(){ TP.toggleSound(); const b=document.getElementById('soundBtn'); if(!b) return; const on=TP.get().sound; b.textContent=on?'🔊':'🔇'; b.classList.toggle('off',!on); }
tpToggleSound();
</script>
</body>
</html>
